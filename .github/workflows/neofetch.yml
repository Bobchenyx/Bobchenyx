name: Update neofetch card

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "neofetch/profile.json"
      - "neofetch/ascii-*.txt"
      - "scripts/neofetch.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render card with live GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/neofetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neofetch/dark.svg neofetch/light.svg
          git diff --cached --quiet || git commit -m "Update neofetch card"
          git push
